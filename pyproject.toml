[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-boardroom-forecast-audit"
version = "0.1.0"
description = "A reproducible audit of a synthetic AI boardroom and festival forecast."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Bouchard" }]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
]

[project.scripts]
boardroom-audit = "boardroom_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

